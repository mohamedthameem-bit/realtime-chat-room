<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed — ChatRoom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .post-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1rem;
        margin-bottom: 1.5rem;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      .post-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .author-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
      }
      .author-info {
        display: flex;
        flex-direction: column;
      }
      .author-username {
        font-weight: 600;
        color: var(--text);
      }
      .post-location {
        font-size: 0.8rem;
        color: var(--text-secondary);
      }
      .post-media {
        width: 100%;
        border-radius: var(--radius-md);
        margin-bottom: 1rem;
        max-height: 600px;
        object-fit: contain;
        background: black;
      }
      .post-actions {
        display: flex;
        gap: 1rem;
        margin-bottom: 0.5rem;
      }
      .action-btn {
        background: none;
        border: none;
        color: var(--text);
        cursor: pointer;
        font-weight: 500;
        padding: 0.5rem;
      }
      .action-btn.liked {
        color: #f472b6;
      }
      .post-likes {
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      .caption-username {
        font-weight: 600;
        margin-right: 0.5rem;
      }
      .post-timestamp {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-top: 0.5rem;
      }
      .story-tray {
        display: flex;
        gap: 1rem;
        overflow-x: auto;
        padding: 1rem 0;
        margin-bottom: 2rem;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      .story-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }
      .story-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      }
      .story-ring img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 2px solid var(--surface);
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <main style="max-width: 600px; margin: 0 auto; padding: 1.5rem;">
      <header class="page-header" style="justify-content: center; border-bottom: none;">
        <h1 class="page-title">Feed</h1>
      </header>

      <div class="story-tray" id="story-tray">
        <!-- Story bubbles injected here -->
      </div>

      <div id="feed-container"></div>
      
      <div style="text-align: center; margin: 2rem 0;">
        <button id="load-more-btn" class="btn btn-secondary" style="display: none;">Load More</button>
      </div>
    </main>

    <div id="toast-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/feed.js"></script>
  </body>
</html>
