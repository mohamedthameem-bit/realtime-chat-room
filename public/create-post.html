<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post — ChatRoom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .create-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }
      .drop-zone {
        border: 2px dashed var(--border);
        border-radius: var(--radius-lg);
        padding: 3rem 1rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-bottom: 1.5rem;
      }
      .drop-zone:hover, .drop-zone.dragover {
        border-color: var(--primary);
        background: var(--surface-hover);
      }
      #preview-container {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        margin-bottom: 1.5rem;
        padding-bottom: 0.5rem;
      }
      .preview-item {
        position: relative;
        flex: 0 0 100px;
        height: 100px;
      }
      .preview-item img, .preview-item video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: var(--radius-md);
      }
      .remove-btn {
        position: absolute;
        top: 4px;
        right: 4px;
        background: rgba(0,0,0,0.6);
        color: white;
        border: none;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <main style="max-width: 600px; margin: 0 auto; padding: 1.5rem;">
      <header class="page-header" style="justify-content: center; border-bottom: none;">
        <h1 class="page-title">Create Post</h1>
      </header>

      <div class="create-container">
        <form id="create-post-form">
          <div id="drop-zone" class="drop-zone">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" style="margin-bottom: 1rem;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <p>Drag photos or video here</p>
            <p class="text-secondary" style="font-size: 0.8rem;">Max 10 photos or 1 video (up to 60s)</p>
            <input type="file" id="media-input" multiple accept="image/jpeg, image/png, image/webp, video/mp4" style="display: none;" />
          </div>

          <div id="preview-container" style="display: none;"></div>

          <div class="input-group" style="margin-bottom: 1rem;">
            <textarea id="caption" class="form-input" placeholder="Write a caption..." rows="4" maxlength="2200" style="resize: vertical;"></textarea>
            <div style="text-align: right; font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;">
              <span id="caption-count">0</span>/2200
            </div>
          </div>

          <div class="input-group" style="margin-bottom: 1rem;">
            <input type="text" id="location" class="form-input" placeholder="Add location" />
          </div>

          <div class="input-group" style="margin-bottom: 1rem;">
            <select id="visibility" class="form-input">
              <option value="public">Public</option>
              <option value="followers">Followers Only</option>
              <option value="close-friends">Close Friends</option>
            </select>
          </div>

          <div class="input-group" style="margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="disable-comments" />
            <label for="disable-comments">Turn off commenting</label>
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Share Post</button>
        </form>
      </div>
    </main>

    <div id="toast-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/create-post.js"></script>
  </body>
</html>
