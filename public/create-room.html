<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatRoom — Create Room</title>
    <meta name="description" content="Create a new public or private chat room." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="create-room-page">
    <div class="bg-blob blob-1" aria-hidden="true"></div>
    <div class="bg-blob blob-2" aria-hidden="true"></div>

    <header class="page-header">
      <div class="page-header-inner">
        <a href="/rooms.html" class="back-link" aria-label="Back to rooms">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Rooms
        </a>
        <h1 class="page-title">Create Room</h1>
        <div></div><!-- Spacer for flex alignment -->
      </div>
    </header>

    <main class="create-room-main">
      <div class="form-card">
        <div id="create-error" class="form-error" role="alert" aria-live="polite" hidden></div>

        <form id="create-room-form" class="auth-form" novalidate>

          <!-- Room Name -->
          <div class="form-group">
            <label for="room-name" class="form-label">Room Name</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
              <input type="text" id="room-name" class="form-input" placeholder="e.g. Gaming Lounge" maxlength="30" required aria-describedby="room-name-hint" />
            </div>
            <span id="room-name-hint" class="form-hint">3–30 characters. Must be unique.</span>
          </div>

          <!-- Visibility Toggle -->
          <div class="form-group">
            <span class="form-label" id="visibility-label">Visibility</span>
            <div class="toggle-group" role="radiogroup" aria-labelledby="visibility-label">
              <label class="toggle-option toggle-option--active">
                <input type="radio" name="status" value="public" checked />
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                Public
              </label>
              <label class="toggle-option">
                <input type="radio" name="status" value="private" />
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Private
              </label>
            </div>
          </div>

          <!-- Room Password (shown only for private) -->
          <div id="room-password-group" class="form-group" hidden>
            <label for="room-password" class="form-label">Room Password</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
              <input type="password" id="room-password" class="form-input" placeholder="Min 4 characters" autocomplete="off" aria-describedby="room-password-hint" />
            </div>
            <span id="room-password-hint" class="form-hint">Members will need this to join.</span>
          </div>

          <!-- Max Members -->
          <div class="form-group">
            <label for="max-members" class="form-label">
              Max Members
              <span id="max-members-display" class="label-badge">10</span>
            </label>
            <input type="range" id="max-members" class="range-input" min="2" max="50" value="10" step="1" aria-describedby="max-members-hint" />
            <span id="max-members-hint" class="form-hint range-hint">
              <span>2</span><span>50</span>
            </span>
          </div>

          <button type="submit" id="create-btn" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Create Room
          </button>
        </form>
      </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/create-room.js"></script>
  </body>
</html>
