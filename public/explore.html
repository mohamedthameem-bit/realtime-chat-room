<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore — ChatRoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    
    .explore-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      position: relative;
      background: #eee;
      cursor: pointer;
    }
    
    .explore-item img, .explore-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .explore-item .icon {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <main style="max-width: 600px; margin: 0 auto; padding: 1.5rem;">
    <header class="page-header" style="justify-content: center; border-bottom: none;">
      <h1 class="page-title">Explore</h1>
    </header>
    <div class="explore-grid" id="explore-grid">
      <!-- Explore items will be injected here -->
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/explore.js"></script>
</body>
</html>
