<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatRoom — Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .profile-container { max-width: 935px; margin: 0 auto; padding: 30px 20px; }
    .profile-header { display: flex; align-items: flex-start; margin-bottom: 44px; gap: 30px; }
    .profile-avatar-container { flex: 0 0 150px; display: flex; justify-content: center; }
    @media (min-width: 768px) {
      .profile-avatar-container { flex: 0 0 290px; }
    }
    .profile-avatar { border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
    .profile-info { flex: 1; display: flex; flex-direction: column; }
    .profile-info-top { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .profile-username { font-size: 20px; font-weight: 400; }
    .profile-actions { display: flex; gap: 10px; }
    .btn-edit, .btn-follow { padding: 5px 15px; font-weight: 600; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
    .btn-edit { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-follow { background: var(--accent); color: white; border: none; }
    .profile-stats { display: flex; gap: 40px; margin-bottom: 20px; }
    .stat-item { font-size: 16px; }
    .stat-item span { font-weight: 600; }
    .profile-bio { font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .profile-name { font-weight: 600; margin-bottom: 5px; }

    .highlights-tray { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; margin-bottom: 30px; scrollbar-width: none; }
    .highlights-tray::-webkit-scrollbar { display: none; }
    .highlight-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; min-width: 77px; }
    .highlight-cover { width: 77px; height: 77px; border-radius: 50%; border: 1px solid var(--border); padding: 3px; display: flex; align-items: center; justify-content: center; }
    .highlight-cover img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .highlight-title { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 77px; text-align: center;}

    .profile-tabs { display: flex; justify-content: center; border-top: 1px solid var(--border); margin-bottom: 2px; gap: 50px; }
    .tab-btn { background: none; border: none; padding: 15px 0; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); border-top: 1px solid var(--text); margin-top: -1px; }
    
    .content-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .grid-item { aspect-ratio: 1; background: var(--surface-2); position: relative; cursor: pointer; overflow: hidden; }
    .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    /* Modal for Edit Profile */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(4px); }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--surface-1); width: 100%; max-width: 400px; border-radius: 12px; padding: 24px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
    .modal-close:hover { color: var(--text); }
    .modal-content h2 { margin-top: 0; font-size: 20px; margin-bottom: 15px; }
    
    @media (max-width: 767px) {
      .profile-stats { gap: 20px; justify-content: center; }
      .profile-header { flex-direction: column; align-items: center; text-align: center; gap: 15px; margin-bottom: 24px; }
      .profile-info-top { justify-content: center; flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body class="profile-page">
  <div class="bg-blob blob-1" aria-hidden="true"></div>
  <div class="bg-blob blob-2" aria-hidden="true"></div>

  <header class="page-header" style="justify-content: center; position: relative;">
    <div class="page-header-inner" style="width: 100%; max-width: 935px; justify-content: center; position: relative;">
      <a href="/home.html" class="back-link" aria-label="Back to home" style="position: absolute; left: 20px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Home
      </a>
      <h1 class="page-title" id="header-username">Profile</h1>
    </div>
  </header>

  <main class="profile-main">
    <div class="profile-container">
      
      <!-- Top Section -->
      <div class="profile-header">
        <div class="profile-avatar-container">
          <div id="profile-avatar-wrapper" style="position: relative;">
            <div id="profile-avatar-display"></div>
            <label id="avatar-upload-label" for="avatar-input" style="display: none; position: absolute; bottom: 5px; right: 5px; background: var(--accent); color: #fff; padding: 8px; border-radius: 50%; cursor: pointer; border: 2px solid var(--surface-1);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </label>
            <input type="file" id="avatar-input" class="visually-hidden" accept="image/jpeg,image/png,image/webp" />
          </div>
        </div>
        
        <div class="profile-info">
          <div class="profile-info-top">
            <h2 class="profile-username" id="display-username"></h2>
            <div class="profile-actions" id="profile-actions"></div>
          </div>
          <div class="profile-stats">
            <div class="stat-item"><span id="stat-posts">0</span> posts</div>
            <div class="stat-item"><span id="stat-followers">0</span> followers</div>
            <div class="stat-item"><span id="stat-following">0</span> following</div>
          </div>
          <div class="profile-bio">
            <div class="profile-name" id="display-name"></div>
            <div id="display-bio"></div>
          </div>
        </div>
      </div>

      <!-- Middle Section: Highlights -->
      <div class="highlights-tray" id="highlights-tray"></div>

      <!-- Tabs Section -->
      <div class="profile-tabs">
        <button class="tab-btn active" data-tab="posts">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
          Posts
        </button>
        <button class="tab-btn" data-tab="reels">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
          Reels
        </button>
        <button class="tab-btn" data-tab="saved" id="tab-saved" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          Saved
        </button>
      </div>

      <!-- Content Section -->
      <div class="content-grid" id="content-grid"></div>
    </div>
  </main>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-profile-modal">
    <div class="modal-content">
      <button class="modal-close" id="close-modal-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <h2>Edit Profile</h2>
      <div id="profile-success" class="form-success" role="status" aria-live="polite" hidden></div>
      <div id="profile-error" class="form-error" role="alert" aria-live="polite" hidden></div>
      <form id="profile-form" class="auth-form" style="margin-top:20px;" novalidate>
        <div class="form-group">
          <label for="profile-username" class="form-label">Username</label>
          <input type="text" id="profile-username" class="form-input" placeholder="username" maxlength="20" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="profile-name" class="form-label">Display Name</label>
          <input type="text" id="profile-name" class="form-input" placeholder="Your full name" maxlength="40" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="profile-bio" class="form-label">Bio</label>
          <textarea id="profile-bio" class="form-input form-textarea" placeholder="Tell people a little about yourself…" maxlength="150" rows="3"></textarea>
        </div>
        <button type="submit" id="save-profile-btn" class="btn-primary" style="width:100%; margin-top: 10px;">Save Profile</button>
      </form>
      <div class="danger-zone" style="margin-top: 20px;">
        <button id="signout-profile-btn" class="btn-leave" style="width:100%; display: flex; justify-content: center; gap: 8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
