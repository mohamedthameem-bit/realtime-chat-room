<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatRoom — My Profile</title>
    <meta name="description" content="Edit your ChatRoom profile, username, bio, and avatar." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="profile-page">
    <div class="bg-blob blob-1" aria-hidden="true"></div>
    <div class="bg-blob blob-2" aria-hidden="true"></div>

    <header class="page-header">
      <div class="page-header-inner">
        <a href="/home.html" class="back-link" aria-label="Back to home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Home
        </a>
        <h1 class="page-title">My Profile</h1>
        <div></div>
      </div>
    </header>

    <main class="profile-main">
      <div class="profile-card">
        <!-- Avatar upload -->
        <div class="avatar-section">
          <div class="avatar-upload-wrapper">
            <div id="profile-avatar-display" class="profile-avatar-display" aria-label="Current avatar"></div>
            <label for="avatar-input" class="avatar-upload-btn" aria-label="Change profile picture" title="Click to change avatar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </label>
            <input type="file" id="avatar-input" class="visually-hidden" accept="image/jpeg,image/png,image/webp" aria-hidden="true" />
          </div>
          <div id="avatar-status" class="avatar-status" role="status" aria-live="polite"></div>
          <p class="avatar-hint">JPG, PNG or WebP · Max 2 MB</p>
        </div>

        <!-- Profile form -->
        <div id="profile-success" class="form-success" role="status" aria-live="polite" hidden></div>
        <div id="profile-error"   class="form-error"   role="alert"  aria-live="polite" hidden></div>

        <form id="profile-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="profile-username" class="form-label">Username</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
              <input type="text" id="profile-username" class="form-input" placeholder="username" maxlength="20" autocomplete="off" />
            </div>
            <span class="form-hint">3–20 chars. Letters, numbers, _ and -.</span>
          </div>

          <div class="form-group">
            <label for="profile-name" class="form-label">
              Display Name
              <span class="label-badge">optional</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
              <input type="text" id="profile-name" class="form-input" placeholder="Your full name" maxlength="40" autocomplete="off" />
            </div>
          </div>

          <div class="form-group">
            <label for="profile-bio" class="form-label">
              Bio
              <span class="label-badge">optional</span>
              <span id="bio-counter" class="bio-counter" aria-live="polite">0 / 150</span>
            </label>
            <textarea id="profile-bio" class="form-input form-textarea" placeholder="Tell people a little about yourself…" maxlength="150" rows="3" aria-describedby="bio-counter"></textarea>
          </div>

          <button type="submit" id="save-profile-btn" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            Save Profile
          </button>
        </form>

        <!-- Danger zone -->
        <div class="danger-zone">
          <button id="signout-profile-btn" class="btn-leave">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
          </button>
        </div>
      </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/profile.js"></script>
  </body>
</html>
