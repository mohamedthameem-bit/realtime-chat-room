<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - ChatRoom</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .profile-container { max-width: 600px; margin: 3rem auto; background: var(--bg-surface); padding: 2rem; border-radius: 16px; border: 1px solid var(--border-color); text-align: center; }
    .profile-avatar { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 1.5rem; position: relative; }
    .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .profile-avatar .status-dot { position: absolute; bottom: 5px; right: 5px; width: 20px; height: 20px; border-width: 3px; margin: 0; }
    .profile-name { font-size: 2rem; margin-bottom: 0.5rem; }
    .profile-bio { color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem; }
    .profile-meta { display: flex; justify-content: center; gap: 2rem; margin-bottom: 2rem; font-size: 0.9rem; color: var(--text-muted); }
    .profile-meta-item { display: flex; flex-direction: column; }
    .profile-meta-value { font-size: 1.25rem; color: var(--text-light); font-weight: bold; margin-bottom: 0.25rem; }
    .profile-actions { display: flex; gap: 1rem; justify-content: center; }
  </style>
</head>
<body>
  <div class="app-layout">
    <main class="app-main">
      <div id="profile-content" class="profile-container fade-up" style="display: none;">
        <!-- Injected via JS -->
      </div>
      <div id="profile-loading" style="text-align: center; margin-top: 4rem; color: var(--text-muted);">
        Loading profile...
      </div>
    </main>
  </div>
  
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/user-profile.js"></script>
  <div id="toast-container"></div>
</body>
</html>
