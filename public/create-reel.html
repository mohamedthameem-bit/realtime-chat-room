<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Reel</title>
  <style>
    form { display: flex; flex-direction: column; gap: 1rem; }
    textarea { min-height: 100px; resize: vertical; padding: 0.5rem; }
    input[type="file"] { padding: 0.5rem; background: #f0f0f0; border-radius: 4px; }
    button { padding: 0.5rem 1rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <main style="max-width: 600px; margin: 0 auto; padding: 1.5rem;">
    <h2>Create a Reel</h2>
    <form id="create-reel-form">
      <div>
        <label for="videoFile">Video File:</label>
        <input type="file" id="videoFile" name="video" accept="video/*" required>
      </div>
      <div>
        <label for="caption">Caption:</label>
        <textarea id="caption" name="caption" placeholder="Write a caption..."></textarea>
      </div>
      <button type="submit">Upload Reel</button>
    </form>
    <div id="message" style="margin-top: 1rem;"></div>
  </main>
  
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/create-reel.js"></script>
</body>
</html>
