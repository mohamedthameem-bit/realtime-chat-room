<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatRoom — Home</title>
    <meta name="description" content="Your ChatRoom home. Create or browse chat rooms." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="home-page">
    <div class="bg-blob blob-1" aria-hidden="true"></div>
    <div class="bg-blob blob-2" aria-hidden="true"></div>

    <div class="home-layout">
      <!-- Top nav bar -->
      <header class="home-navbar">
        <div class="home-navbar-brand">
          <svg width="28" height="28" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <rect width="40" height="40" rx="10" fill="url(#lgNav)"/>
            <path d="M10 13a3 3 0 013-3h14a3 3 0 013 3v10a3 3 0 01-3 3h-4l-5 5v-5h-5a3 3 0 01-3-3V13z" fill="white" fill-opacity="0.9"/>
            <defs><linearGradient id="lgNav" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#3ECFCF"/></linearGradient></defs>
          </svg>
          <span class="home-navbar-title">ChatRoom</span>
        </div>
        <div class="home-navbar-actions">
          <a href="/profile.html" class="nav-link" id="profile-link">
            <div id="nav-avatar" class="nav-avatar" aria-hidden="true"></div>
            <span id="nav-username" class="nav-username">…</span>
          </a>
          <button id="signout-btn" class="btn-ghost" aria-label="Sign out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
          </button>
        </div>
      </header>

      <!-- Main content -->
      <main class="home-main">
        <div class="home-hero">
          <h2 class="home-greeting" id="home-greeting">Welcome back!</h2>
          <p class="home-tagline">Jump into a conversation or start your own.</p>
        </div>

        <!-- Primary action cards -->
        <div class="home-actions">
          <a href="/create-room.html" class="action-card action-card--create" id="create-room-card">
            <div class="action-card-icon" aria-hidden="true">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            </div>
            <h3 class="action-card-title">Create Room</h3>
            <p class="action-card-desc">Start a new public or private chat room for up to 50 people.</p>
          </a>

          <a href="/rooms.html" class="action-card action-card--browse" id="browse-rooms-card">
            <div class="action-card-icon" aria-hidden="true">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <h3 class="action-card-title">Browse Rooms</h3>
            <p class="action-card-desc">See all active rooms and jump straight into the conversation.</p>
          </a>
        </div>
      </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/home.js"></script>
  </body>
</html>
