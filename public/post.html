<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post — ChatRoom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .post-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1rem;
        margin-bottom: 1.5rem;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
      .post-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
      .author-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
      .author-info { display: flex; flex-direction: column; }
      .author-username { font-weight: 600; color: var(--text); }
      .post-location { font-size: 0.8rem; color: var(--text-secondary); }
      .post-media { width: 100%; border-radius: var(--radius-md); margin-bottom: 1rem; max-height: 600px; object-fit: contain; background: black; }
      .post-actions { display: flex; gap: 1rem; margin-bottom: 0.5rem; }
      .action-btn { background: none; border: none; color: var(--text); cursor: pointer; font-weight: 500; padding: 0.5rem; }
      .action-btn.liked { color: #f472b6; }
      .post-likes { font-weight: 600; margin-bottom: 0.5rem; }
      .caption-username { font-weight: 600; margin-right: 0.5rem; }
      .post-timestamp { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem; }
      
      .comments-section {
        max-width: 600px;
        margin: 0 auto 3rem auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1rem;
      }
      .comment-input-wrapper { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
      .comment-input-wrapper input { flex: 1; }
      .comment-item { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
      .comment-avatar { width: 32px; height: 32px; border-radius: 50%; }
      .comment-content { flex: 1; }
      .comment-text { font-size: 0.95rem; margin-bottom: 0.25rem; }
      .comment-actions { font-size: 0.8rem; color: var(--text-secondary); display: flex; gap: 1rem; }
      .comment-btn { background: none; border: none; color: inherit; cursor: pointer; padding: 0; }
    </style>
  </head>
  <body class="app-layout">
    <nav id="app-sidebar" class="app-sidebar" aria-label="Main Navigation"></nav>

    <main class="app-main">
      <header class="app-header">
        <h1>Post</h1>
      </header>

      <div id="post-container"></div>
      
      <div id="comments-section" class="comments-section" style="display: none;">
        <h3>Comments</h3>
        <div class="comment-input-wrapper" style="margin-top: 1rem;">
          <input type="text" id="comment-input" class="form-input" placeholder="Add a comment..." />
          <button id="submit-comment" class="btn btn-primary">Post</button>
        </div>
        <div id="comments-list"></div>
      </div>
    </main>

    <div id="toast-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/post.js"></script>
  </body>
</html>
