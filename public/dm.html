<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM - ChatRoom</title>
    <meta name="description" content="Direct Message" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="chat-page">

    <!-- Connection status banner -->
    <div id="connection-banner" class="connection-banner" role="status" aria-live="polite" hidden>
      <span class="banner-dot" aria-hidden="true"></span>
      <span id="connection-text">Reconnecting…</span>
    </div>

    <div class="chat-layout">
      <!-- ═══ MAIN CHAT ═══ -->
      <div class="chat-main">
        <header class="chat-header">
          <!-- Back button (mainly for mobile to go back to DMs list) -->
          <a href="/dms.html" class="icon-btn" aria-label="Back to DMs" style="margin-right: 0.5rem; text-decoration: none; color: var(--text-secondary);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>

          <div class="chat-header-title" style="flex: 1;">
            <div id="header-avatar" class="header-avatar" aria-hidden="true" style="margin-right: 0.75rem;"></div>
            <div style="display: flex; flex-direction: column;">
              <span id="header-name" class="header-room-name" style="font-size: 1.1rem;">Loading...</span>
              <span id="header-status" style="font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.3rem;">Connecting...</span>
            </div>
          </div>

          <div class="header-actions" style="display: flex; gap: 0.5rem; margin-left: auto;">
            <button id="call-btn" class="icon-btn" aria-label="Start Voice Call" title="Voice Call" style="color: var(--text-primary); transition: color var(--transition-fast);">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </button>
          </div>
        </header>

        <main id="messages-container" class="messages-container" aria-label="Chat messages" aria-live="polite"></main>

        <div class="typing-indicator" id="typing-indicator" aria-live="polite" hidden>
          <span class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
          <span id="typing-text" class="typing-text"></span>
        </div>

        <!-- ═══ REPLY PREVIEW BAR ═══ -->
        <div id="reply-preview-bar" class="reply-preview-bar" hidden>
          <svg class="reply-preview-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
          <span class="reply-preview-content">
            <span class="reply-preview-name" id="reply-preview-author"></span>
            <span class="reply-preview-text" id="reply-preview-text"></span>
          </span>
          <button type="button" id="reply-cancel-btn" class="reply-preview-cancel" aria-label="Cancel reply">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>

        <!-- ═══ MESSAGE INPUT FOOTER ═══ -->
        <div style="position: relative;">
          <footer class="message-input-bar">
            <form id="chat-form" class="message-input-wrapper" style="width: 100%; display: flex; align-items: flex-end; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 0.5rem 0.5rem 0.5rem 1rem; margin: 0; box-shadow: 0 4px 20px rgba(0,0,0,0.2); transition: border-color var(--transition-fast), box-shadow var(--transition-fast);">
              <textarea id="message-input" class="message-input" placeholder="Message..." rows="1" maxlength="500" aria-label="Message input" style="flex: 1; min-height: 24px; max-height: 120px; border: none; background: transparent; color: var(--text-primary); font-size: 0.95rem; resize: none; padding: 0.25rem 0; outline: none; line-height: 1.5;"></textarea>
              <div class="input-actions" style="display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; margin-left: 0.5rem; padding-bottom: 0.125rem;">
                <span id="char-counter" class="char-counter" aria-live="polite" style="font-size: 0.75rem; color: var(--text-muted); font-weight: 500;">0 / 500</span>
                <button type="submit" id="send-btn" class="send-btn" aria-label="Send message" disabled style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--accent); color: #fff; transition: background var(--transition-fast), transform var(--transition-fast);">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left: -2px;"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
            </form>
          </footer>
        </div>
      </div>
    </div>

    <!-- ═══ INCOMING CALL MODAL ═══ -->
    <div id="incoming-call-modal" class="modal-backdrop" role="dialog" aria-modal="true" hidden style="z-index: 1000; display: flex; align-items: center; justify-content: center;">
      <div class="modal-card" style="text-align: center; max-width: 320px;">
        <div class="call-avatar-ring" style="width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 1rem; border: 3px solid var(--accent); position: relative;">
          <div id="incoming-call-avatar" style="width: 100%; height: 100%; border-radius: 50%; overflow: hidden;"></div>
        </div>
        <h3 id="incoming-call-name" style="margin-bottom: 0.5rem; font-size: 1.25rem;">Caller Name</h3>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Incoming Voice Call...</p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
          <button id="reject-call-btn" class="btn-leave" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); flex: 1;">Decline</button>
          <button id="accept-call-btn" class="btn-primary" style="background: #10b981; flex: 1; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">Accept</button>
        </div>
      </div>
    </div>

    <!-- ═══ ACTIVE CALL WIDGET ═══ -->
    <div id="active-call-widget" class="active-call-widget" hidden style="position: absolute; top: 70px; right: 20px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem; box-shadow: var(--shadow-lg); z-index: 900; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; min-width: 200px;">
      <div style="font-size: 0.85rem; color: var(--accent-light); font-weight: 600;" id="call-status-text">Connecting...</div>
      <div style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums;" id="call-duration">00:00</div>
      <audio id="remote-audio" autoplay></audio>
      <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
        <button id="mute-call-btn" class="icon-btn" style="background: var(--bg-elevated); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border);" title="Mute/Unmute">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="mic-icon"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <button id="end-call-btn" class="icon-btn" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;" title="End Call">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>
        </button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/dm.js"></script>

    <!-- ═══ TOAST CONTAINER ═══ -->
    <div id="toast-container"></div>
  </body>
</html>
