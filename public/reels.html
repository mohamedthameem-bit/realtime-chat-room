<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reels</title>
  <style>
    /* Ensure the main container fits on screen to allow proper scroll snapping */
    body, html { height: 100%; margin: 0; padding: 0; }
    
    #reels-container {
      height: calc(100vh - 3rem); /* Account for main padding */
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      background: #000;
      border-radius: 8px;
    }
    
    .reel-item {
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background: #000;
      border-bottom: 1px solid #333;
    }
    
    .reel-video {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }
    
    .reel-info {
      position: absolute;
      bottom: 2rem;
      left: 1rem;
      color: white;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      z-index: 10;
    }
    
    .reel-info h3 { margin: 0 0 0.5rem 0; font-size: 1.1rem; }
    .reel-info p { margin: 0; font-size: 0.9rem; }
    
    .reel-actions {
      position: absolute;
      bottom: 2rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      z-index: 10;
      align-items: center;
    }
    
    .reel-actions button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      color: white;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .reel-actions button.liked { color: red; }
    .reel-actions span { color: white; font-size: 0.8rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
  </style>
</head>
<body>
  <main style="max-width: 600px; margin: 0 auto; padding: 1.5rem;">
    <div id="reels-container">
      <!-- Reels will be injected here -->
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/reels.js"></script>
</body>
</html>
