<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatRoom — Browse Rooms</title>
    <meta name="description" content="Browse and join active chat rooms." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="rooms-page">
    <header class="page-header">
      <div class="page-header-inner">
        <a href="/home.html" class="back-link" aria-label="Back to home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Home
        </a>
        <h1 class="page-title">Browse Rooms</h1>
        <a href="/create-room.html" class="btn-primary btn-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Room
        </a>
      </div>
    </header>

    <main class="rooms-main">
      <!-- Loading state -->
      <div id="rooms-loading" class="rooms-loading" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading rooms…</p>
      </div>

      <!-- Error state -->
      <div id="rooms-error" class="rooms-error" role="alert" aria-live="polite" hidden>
        <p id="rooms-error-text">Failed to load rooms.</p>
        <button id="rooms-retry-btn" class="btn-ghost">Retry</button>
      </div>

      <!-- Empty state -->
      <div id="rooms-empty" class="rooms-empty" hidden>
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>No rooms yet. <a href="/create-room.html">Create one!</a></p>
      </div>

      <!-- Room cards grid -->
      <div id="rooms-grid" class="rooms-grid" aria-label="Available rooms" hidden></div>
    </main>

    <!-- ── Private Room Password Modal ── -->
    <div id="password-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <div class="modal-card">
        <h2 id="modal-title" class="modal-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Private Room
        </h2>
        <p id="modal-room-name" class="modal-room-name"></p>
        <div id="modal-error" class="form-error" role="alert" aria-live="polite" hidden></div>
        <div class="form-group">
          <label for="modal-password" class="form-label">Room Password</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input type="password" id="modal-password" class="form-input" placeholder="Enter room password" autocomplete="off" />
          </div>
        </div>
        <div class="modal-actions">
          <button id="modal-cancel-btn" class="btn-ghost">Cancel</button>
          <button id="modal-join-btn" class="btn-primary">Join Room</button>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/rooms.js"></script>
  </body>
</html>
