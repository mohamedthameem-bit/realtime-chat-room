<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatRoom — Sign In / Sign Up</title>
    <meta name="description" content="Sign in or create an account to join real-time chat rooms." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="auth-page">
    <div class="bg-blob blob-1" aria-hidden="true"></div>
    <div class="bg-blob blob-2" aria-hidden="true"></div>

    <main class="auth-container">
      <div class="auth-card">
        <!-- Branding -->
        <div class="auth-header">
          <div class="logo" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <rect width="40" height="40" rx="12" fill="url(#lg1)"/>
              <path d="M10 13a3 3 0 013-3h14a3 3 0 013 3v10a3 3 0 01-3 3h-4l-5 5v-5h-5a3 3 0 01-3-3V13z" fill="white" fill-opacity="0.9"/>
              <defs><linearGradient id="lg1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#3ECFCF"/></linearGradient></defs>
            </svg>
          </div>
          <h1 class="auth-title">ChatRoom</h1>
          <p class="auth-subtitle">Real-time conversations, instantly.</p>
        </div>

        <!-- Tab switcher -->
        <div class="auth-tabs" role="tablist" aria-label="Sign in or Sign up">
          <button id="tab-signin" class="auth-tab auth-tab--active" role="tab" aria-selected="true" aria-controls="panel-signin">Sign In</button>
          <button id="tab-signup" class="auth-tab" role="tab" aria-selected="false" aria-controls="panel-signup">Sign Up</button>
          <span class="auth-tab-indicator" aria-hidden="true"></span>
        </div>

        <!-- ── Sign In Panel ── -->
        <div id="panel-signin" class="auth-panel auth-panel--active" role="tabpanel" aria-labelledby="tab-signin">
          <div id="signin-error" class="form-error" role="alert" aria-live="polite" hidden></div>
          <form id="signin-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="signin-username" class="form-label">Username</label>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                <input type="text" id="signin-username" class="form-input" placeholder="your_username" maxlength="20" autocomplete="username" required />
              </div>
            </div>
            <div class="form-group">
              <label for="signin-password" class="form-label">Password</label>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                <input type="password" id="signin-password" class="form-input" placeholder="••••••••" autocomplete="current-password" required />
                <button type="button" class="input-reveal-btn" aria-label="Show password" data-target="signin-password">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" id="signin-btn" class="btn-primary">Sign In</button>
          </form>
        </div>

        <!-- ── Sign Up Panel ── -->
        <div id="panel-signup" class="auth-panel" role="tabpanel" aria-labelledby="tab-signup" hidden>
          <div id="signup-error" class="form-error" role="alert" aria-live="polite" hidden></div>
          <form id="signup-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="signup-username" class="form-label">Username</label>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
                <input type="text" id="signup-username" class="form-input" placeholder="your_username" maxlength="20" autocomplete="username" required aria-describedby="signup-username-hint"/>
              </div>
              <span id="signup-username-hint" class="form-hint">3–20 characters. Letters, numbers, underscores, hyphens.</span>
            </div>
            <div class="form-group">
              <label for="signup-password" class="form-label">Password</label>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                <input type="password" id="signup-password" class="form-input" placeholder="Min 8 chars, 1 letter, 1 number" autocomplete="new-password" required aria-describedby="signup-password-hint"/>
                <button type="button" class="input-reveal-btn" aria-label="Show password" data-target="signup-password">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <span id="signup-password-hint" class="form-hint">At least 8 characters, including a letter and a number.</span>
            </div>
            <!-- Password strength bar -->
            <div class="password-strength" aria-hidden="true">
              <div id="strength-bar" class="strength-bar"></div>
            </div>
            <button type="submit" id="signup-btn" class="btn-primary">Create Account</button>
          </form>
        </div>
      </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
